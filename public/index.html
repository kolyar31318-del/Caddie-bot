<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caddie Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
      color: #f0f0f0;
    }
    h1 { font-size: 1rem; letter-spacing: 0.3em; text-transform: uppercase; color: #555; margin-bottom: 3rem; }
    #status-circle {
      width: 160px; height: 160px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
      font-weight: bold; cursor: pointer; transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
      border: none; outline: none; user-select: none;
    }
    #status-circle.on { background: #1aff7a; color: #0a0a0a; box-shadow: 0 0 60px #1aff7a55, 0 0 120px #1aff7a22; }
    #status-circle.off { background: #222; color: #555; box-shadow: none; border: 2px solid #333; }
    #status-circle:active { transform: scale(0.96); }
    #label { margin-top: 2rem; font-size: 0.75rem; letter-spacing: 0.2em; color: #444; text-transform: uppercase; }
    #label span { color: #888; }
  </style>
</head>
<body>
  <h1>Caddie Bot</h1>
  <button id="status-circle" onclick="toggle()">...</button>
  <p id="label">tap to <span id="action">—</span></p>
  <script>
    async function fetchStatus() {
      const res = await fetch("/status");
      const data = await res.json();
      render(data.available);
    }
    async function toggle() {
      const res = await fetch("/toggle", { method: "POST" });
      const data = await res.json();
      render(data.available);
    }
    function render(available) {
      const circle = document.getElementById("status-circle");
      const action = document.getElementById("action");
      if (available) {
        circle.textContent = "I'M IN";
        circle.className = "on";
        action.textContent = "go offline";
      } else {
        circle.textContent = "OFF";
        circle.className = "off";
        action.textContent = "go online";
      }
    }
    fetchStatus();
  </script>
</body>
</html>
